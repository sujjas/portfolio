<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drag Item · Sena Design System</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">

  <!-- Design system -->
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="buttons.css">
  <link rel="stylesheet" href="drag-item.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--ff-text);
      color: var(--text-primary);
      background: var(--bg-card);
      padding: 48px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      -webkit-font-smoothing: antialiased;
    }

    h1 { font-size: var(--text-3xl); font-weight: var(--fw-bold); margin: 0 0 8px; }
    h2 { font-size: var(--text-xl); font-weight: var(--fw-bold); margin: 40px 0 16px; color: var(--text-secondary); }

    .demo-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 331px;
    }

    .state-label {
      font-size: var(--text-xs);
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
    }
  </style>
</head>
<body>

<button class="btn btn-ghost btn-sm theme-toggle" onclick="toggleTheme()">
  <span class="btn-icon">sun-bright</span>
</button>

<h1>Drag Item</h1>

<div class="demo-group">
  <span class="state-label">Default</span>
  <div class="drag-item">
    <span class="drag-handle fa">grip-vertical</span>
    <div class="drag-item-content">
      <span class="drag-item-icon fa">chart-pie</span>
      <span class="source-label">Customer journey drop-off points</span>
    </div>
  </div>
</div>

<div class="demo-group">
  <span class="state-label">Hover (hover over to see)</span>
  <div class="drag-item">
    <span class="drag-handle fa">grip-vertical</span>
    <div class="drag-item-content">
      <span class="drag-item-icon fa">chart-pie</span>
      <span class="source-label">Transaction data</span>
    </div>
  </div>
</div>

<div class="demo-group">
  <span class="state-label">Pressed (click and hold)</span>
  <div class="drag-item">
    <span class="drag-handle fa">grip-vertical</span>
    <div class="drag-item-content">
      <span class="drag-item-icon fa">chart-pie</span>
      <span class="source-label">Marketing performance</span>
    </div>
  </div>
</div>

<h2>With App Badge</h2>

<div class="demo-group">
  <div class="drag-item">
    <span class="drag-handle fa">grip-vertical</span>
    <div class="drag-item-content">
      <span class="drag-item-icon fa">chart-pie</span>
      <span class="source-label">Consumers Habits</span>
    </div>
  </div>
</div>

<script>
  function toggleTheme() {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', isDark ? '' : 'dark');
    document.querySelector('.theme-toggle .btn-icon').textContent =
      isDark ? 'sun-bright' : 'moon';
  }

  // Listen for theme changes from parent (design system index)
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'set-theme') {
      document.documentElement.setAttribute('data-theme', e.data.theme);
    }
  });

  // Hide own toggle when inside an iframe
  if (window !== window.top) {
    const toggle = document.querySelector('.theme-toggle');
    if (toggle) toggle.style.display = 'none';
  }
</script>

</body>
</html>
