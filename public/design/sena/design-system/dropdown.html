<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropdown · Sena Design System</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">

  <!-- Design system -->
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="buttons.css">
  <link rel="stylesheet" href="checkbox.css">
  <link rel="stylesheet" href="search-bar.css">
  <link rel="stylesheet" href="dropdown.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--ff-text);
      color: var(--text-primary);
      background: var(--bg-card);
      padding: 48px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      -webkit-font-smoothing: antialiased;
    }

    h1 { font-size: var(--text-3xl); font-weight: var(--fw-bold); margin: 0 0 8px; }
    h2 { font-size: var(--text-xl); font-weight: var(--fw-bold); margin: 0; color: var(--text-secondary); }

    .demo-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .demo-area {
      position: relative;
    }

    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
    }
  </style>
</head>
<body>

<button class="btn btn-ghost btn-sm theme-toggle" onclick="toggleTheme()">
  <span class="btn-icon">sun-bright</span>
  Theme
</button>

<div>
  <h1>Dropdown</h1>
  <p class="body-default" style="color: var(--text-tertiary);">Sena Design System v1.0</p>
</div>

<!-- ─── Default (closed) ──────────────────────────────────────────────── -->
<div class="demo-section" style="position: relative; z-index: 2;">
  <h2>Default (closed)</h2>
  <div>
    <div class="dropdown-anchor">
      <button class="btn btn-secondary btn-sm" id="demoTrigger1">
        <span class="btn-icon">plus</span>
        Add data source
      </button>
      <div class="dropdown-popover" id="demoDropdown1">
        <div class="search-bar">
          <span class="search-bar-icon fa">magnifying-glass</span>
          <input type="text" class="search-bar-input" placeholder="Search data source">
          <button class="search-bar-clear fa" aria-label="Clear search">circle-xmark</button>
        </div>
        <div class="dropdown-section">
          <div class="dropdown-section-title">Recents</div>
          <div class="dropdown-list">
            <label class="checkbox dropdown-item">
              <input type="checkbox" class="checkbox-input" checked>
              <span class="checkbox-box"><span class="checkbox-icon">check</span></span>
              Marketing channel performance
            </label>
            <label class="checkbox dropdown-item">
              <input type="checkbox" class="checkbox-input">
              <span class="checkbox-box"><span class="checkbox-icon">check</span></span>
              Sales performance by region
            </label>
            <label class="checkbox dropdown-item">
              <input type="checkbox" class="checkbox-input">
              <span class="checkbox-box"><span class="checkbox-icon">check</span></span>
              Sales partners growth
            </label>
            <label class="checkbox dropdown-item">
              <input type="checkbox" class="checkbox-input">
              <span class="checkbox-box"><span class="checkbox-icon">check</span></span>
              Partners performances by country
            </label>
            <label class="checkbox dropdown-item">
              <input type="checkbox" class="checkbox-input">
              <span class="checkbox-box"><span class="checkbox-icon">check</span></span>
              5-year growth report
            </label>
          </div>
        </div>
        <div class="dropdown-actions">
          <button class="btn btn-primary btn-sm">
            <span class="btn-icon">plus</span>
            Add selected sources
          </button>
          <button class="btn btn-ghost btn-sm">
            <span class="btn-icon">arrow-up-right-from-square</span>
            View all sources
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ─── Open state ────────────────────────────────────────────────────── -->
<div class="demo-section" style="position: relative; z-index: 1;">
  <h2>Open state</h2>
  <div class="demo-area">
    <div class="dropdown-anchor">
      <button class="btn btn-secondary btn-sm">
        <span class="btn-icon">plus</span>
        Add data source
      </button>
      <div class="dropdown-popover open">
        <div class="search-bar">
          <span class="search-bar-icon fa">magnifying-glass</span>
          <input type="text" class="search-bar-input" placeholder="Search data source">
          <button class="search-bar-clear fa" aria-label="Clear search">circle-xmark</button>
        </div>
        <div class="dropdown-section">
          <div class="dropdown-section-title">Recents</div>
          <div class="dropdown-list">
            <label class="checkbox dropdown-item">
              <input type="checkbox" class="checkbox-input" checked>
              <span class="checkbox-box"><span class="checkbox-icon">check</span></span>
              Marketing channel performance
            </label>
            <label class="checkbox dropdown-item">
              <input type="checkbox" class="checkbox-input">
              <span class="checkbox-box"><span class="checkbox-icon">check</span></span>
              Sales performance by region
            </label>
            <label class="checkbox dropdown-item">
              <input type="checkbox" class="checkbox-input">
              <span class="checkbox-box"><span class="checkbox-icon">check</span></span>
              Sales partners growth
            </label>
            <label class="checkbox dropdown-item">
              <input type="checkbox" class="checkbox-input">
              <span class="checkbox-box"><span class="checkbox-icon">check</span></span>
              Partners performances by country
            </label>
            <label class="checkbox dropdown-item">
              <input type="checkbox" class="checkbox-input">
              <span class="checkbox-box"><span class="checkbox-icon">check</span></span>
              5-year growth report
            </label>
          </div>
        </div>
        <div class="dropdown-actions">
          <button class="btn btn-primary btn-sm">
            <span class="btn-icon">plus</span>
            Add selected sources
          </button>
          <button class="btn btn-ghost btn-sm">
            <span class="btn-icon">arrow-up-right-from-square</span>
            View all sources
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // Interactive demo toggle
  const trigger1 = document.getElementById('demoTrigger1');
  const dropdown1 = document.getElementById('demoDropdown1');

  trigger1.addEventListener('click', (e) => {
    e.stopPropagation();
    dropdown1.classList.toggle('open');
  });

  document.addEventListener('click', (e) => {
    if (!dropdown1.contains(e.target) && e.target !== trigger1) {
      dropdown1.classList.remove('open');
    }
  });

  dropdown1.addEventListener('click', (e) => {
    e.stopPropagation();
  });

  function toggleTheme() {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', isDark ? '' : 'dark');
    document.querySelector('.theme-toggle .btn-icon').textContent =
      isDark ? 'sun-bright' : 'moon';
  }

  // Listen for theme changes from parent (design system index)
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'set-theme') {
      document.documentElement.setAttribute('data-theme', e.data.theme);
    }
  });

  // Hide own toggle when inside an iframe
  if (window !== window.top) {
    const toggle = document.querySelector('.theme-toggle');
    if (toggle) toggle.style.display = 'none';
  }
</script>

</body>
</html>
