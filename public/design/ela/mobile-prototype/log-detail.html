    var dir = sessionStorage.getItem('vt-dir');
    if (dir) {
      document.documentElement.setAttribute('data-vt-direction', dir);
      sessionStorage.removeItem('vt-dir');
    }
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Ela — Mobile · Log</title>
<link rel="manifest" href="manifest.webmanifest" />

<meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#171c1c" />

<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  /* Detail top nav: back button (left) + centered title. The grid's third
     column is an empty spacer matching the back button so the title stays
     optically centered. The min-height matches the Logs page top nav (the
     taller Chat/Logs tab row) so `.phone-screen` starts at the same Y on both
     pages — otherwise the page-transition slide drifts vertically. */
  .phone-top--detail {
    grid-template-columns: 28px 1fr 28px;
    min-height: 64px;
  }
  .phone-top__title {
    margin: 0;
    text-align: center;
    font-family: var(--ff-display);
    font-weight: 700;
    font-size: var(--fz-m);
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* The full log card fills the body so its CTA pins to the bottom edge. */
  .phone-body--detail {
    padding: 4px 16px 16px;
    gap: 0;
  }
  .phone-body--detail .log-card-full {
    max-width: none;
    flex: 1 1 auto;
    min-height: 0;
  }

  /* ===== Questionnaire sheet =====
     The home screen lives inside .phone-interior so the sheet can slide up over
     it. Mirrors the chat-sheet pattern from chat.html. */
  .phone-interior {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .chat-sheet-mount {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: flex;
  }
  .chat-sheet-mount > .sheet { flex: 1 1 auto; }
  .chat-sheet-mount.is-closed { display: none; }

  /* Motion curves. Named so every transition on this page cites one instead of
     hand-rolling a bezier, and so the weak built-in `ease` stops creeping in on
     enters and exits. Values from the emilkowalski/skill animation standards
     (.agents/skills/review-animations/STANDARDS.md). */
  :root {
    --ease-out:    cubic-bezier(0.23, 1, 0.32, 1);     /* enter/exit — strong, responsive */
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);    /* movement across the screen */
    --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);     /* iOS-like sheet/collapse */
  }

  @keyframes chat-sheet-up   { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes chat-sheet-down { from { transform: translateY(0); } to { transform: translateY(100%); } }
  .chat-sheet-mount.is-entering { animation: chat-sheet-up 440ms cubic-bezier(0.32, 0.72, 0, 1) both; }
  .chat-sheet-mount.is-leaving  { animation: chat-sheet-down 360ms cubic-bezier(0.4, 0, 0.84, 0.36) both; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) {
    .chat-sheet-mount.is-entering { animation: none; }
    .chat-sheet-mount.is-leaving  { animation: none; transform: translateY(100%); }
  }

  /* Sheet surface uses the solid-log canvas (applied via the `solid-log` class). */
  .chat-sheet-mount .sheet.solid-log { background: var(--color-concrete-25); }
  .sheet__body .chat { max-width: none; }

  /* ----- Scroll-behind-header: the image+progress header overlays the body so
     the Q&A scrolls UP BEHIND it as the thread grows — mirroring the web
     love-score page's sticky image hero. Instead of taking its own flex row
     above the body, the header floats over the top; the body's top padding
     (set to the header's real height in JS on open — see openQuiz) starts the
     chat just below it, and older Q&A disappears cleanly behind the opaque
     illustration. ----- */
  #quizSheet .sheet__header--image {
    position: absolute; top: 0; left: 0; right: 0; z-index: 2;
  }
  #quizSheet .sheet__body {
    padding-top: 188px;   /* fallback; refined to the measured header height on open */
  }
  /* Tail spacer at the end of the thread — grown on demand (JS) so the latest
     answer + question can climb up to just below the header after each answer,
     mirroring the web prototype's .qa-tail. */
  #quizSheet .quiz-tail { flex: 0 0 auto; height: 0; }

  /* The "When done" message is authored as two lines — keep the break. */
  #quizChat .chat-msg--outro .chat-msg__text { white-space: pre-line; }

  /* ===== Seamless completion (Conversational Log V2) =====
     Per the Jul 28 design sync the finished log must flow into free chat with
     no manual tap and no intro/outro screens — so the thank-you card and its
     "Keep chatting" button are gone. What remains is motion: Ela's closing
     message lifts, and the composer and prompts rise from the bottom edge, so
     the sheet deepens into a conversation rather than swapping screens. */
  @keyframes quiz-outro-out {
    from { opacity: 1; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(-12px); }
  }
  @keyframes extend-msg-in {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes extend-dock-in {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* Messages get NO entrance animation — they appear the same way every quiz
     message does, preserving the log's one-message-at-a-time rhythm. Only the
     new furniture animates: the composer rises from the bottom edge and the
     suggested prompts slide in from the right, staggered 50ms apart. */
  @keyframes extend-starters-in {
    from { opacity: 0; transform: translateX(72px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  #quizSheet.is-opening .sheet__footer {
    animation: extend-dock-in 360ms cubic-bezier(0.32, 0.72, 0, 1) both;
  }
  #quizSheet.is-opening .extend-starters > * {
    animation: extend-starters-in 340ms cubic-bezier(0.23, 1, 0.32, 1) both;
  }
  #quizSheet.is-opening .extend-starters > *:nth-child(1) { animation-delay: 90ms; }
  #quizSheet.is-opening .extend-starters > *:nth-child(2) { animation-delay: 140ms; }
  #quizSheet.is-opening .extend-starters > *:nth-child(3) { animation-delay: 190ms; }

  /* Completion badge — replaces the header progress bar the moment the log
     is done (crit: "replace the progress bar with the badge of completion"). */
  .header-badge {
    position: absolute;
    left: 50%;
    bottom: 8px;
    transform: translateX(-50%);
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 14px 5px 6px;
    background: var(--bg-translucent);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    border: 1px solid var(--stroke-shine-highlight);
    border-radius: var(--br-full);
    box-shadow: var(--shadow-2);
    font-family: var(--ff-display);
    font-weight: var(--fw-bold);
    font-size: var(--fz-s);
    color: var(--text-primary);
    white-space: nowrap;
    animation: quiz-card-in 320ms cubic-bezier(0.23, 1, 0.32, 1) both;
  }
  .header-badge[hidden] { display: none; }
  .header-badge__check {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    flex: 0 0 auto;
    border-radius: var(--br-full);
    background: var(--bg-brand-primary);
    color: var(--bg-active);
    font-size: 10px;
  }

  /* ----- Topic-header variant (?style=topic) -----
     Completing the log retires its tall hero: the header collapses to a short
     topic band with the topic's own illustration, the back control drops to
     straddle the band's bottom edge, and the log itself demotes into a DS
     `.log-card` in the thread. Everything below — invite, prompts, composer —
     is untouched, which is the point: only the log's own chrome recedes. */
  #quizSheet[data-style="topic"] .sheet__header--image,
  #quizSheet[data-style="topic"] .sheet__body {
    /* 520ms and layout properties, both deliberate: the band collapse is a
       once-per-log moment (the frequency table allows a longer, rarer beat) and
       the body's top padding has to follow the header's height for the card to
       land under it. transform would slide the band without reflowing what is
       below. Every other transition here stays under 300ms and on the GPU. */
    transition: min-height 520ms var(--ease-drawer),
                height 520ms var(--ease-drawer),
                padding-top 520ms var(--ease-drawer);
  }
  /* Collapsed band geometry. `!important` because sheet.css sizes this header
     and a plain override (even inline) was losing the box calculation. */
  #quizSheet[data-style="topic"].is-collapsed .sheet__header--image {
    min-height: 75px !important;
    height: 75px !important;
    /* Both axes centred, as sheet.css already does — the earlier flex-start
       was only there to stack the completion badge, which the band no longer
       carries (the log card is the completion beat). */
    justify-content: center !important;
    padding: 0 16px !important;
  }
  /* The band now names the topic, not the log — give it the heading size. */
  #quizSheet[data-style="topic"].is-collapsed .sheet__title { font-size: var(--fz-l); }
  /* Back, not close. Optically centred in the 75px band: (75 - 44) / 2. */
  #quizSheet[data-style="topic"].is-collapsed .sheet__nav--close {
    left: 16px;
    right: auto;
    top: 15px;
  }
  /* The receipt IS the design system log card. */
  /* The DS card is a fixed 120px tall; here it may grow instead, so wrapped
     copy pushes the card out rather than spilling past its rounded corner.
     The thumb's `height: 100%` needs a definite height to resolve against, so
     with `height: auto` it collapsed to the image's own aspect ratio — stretch
     it instead, which fills the card at any height. */
  #quizChat .log-card { width: 100%; flex: 0 0 auto; height: auto; min-height: 120px; }
  #quizChat .log-card__thumb { align-self: stretch; height: auto; }
  /* Chip + deadline on one line, as the design has them. That row has no slack
     by construction: in frame 6245:70721 the chip (48) + gap (16) + deadline
     (161) come to exactly the 225px content width, so any copy longer than the
     frame's wraps. Three things buy room, and the copy is the one that matters:
       · the collapsed body uses the design's 16px gutter (below),  +8px
       · the info gap drops 16 -> 8,                                +8px
       · "Up to 48h" rather than "Up to 48 hrs to approve",        +60px
     At 390px (the real .phone width) the long version wrapped; this one clears
     by ~78px, so it still holds on a 375px frame. Ela's next line says "once
     it's approved", so the card does not have to carry the word too.
     If copy ever outgrows the row it wraps rather than truncating — an ellipsis
     would hide text with no way to reveal it. */
  #quizChat .log-card__info { flex-wrap: wrap; gap: 8px; }
  /* The DS keeps meta on one line; here it may wrap, for the same reason. */
  #quizChat .log-card__meta { white-space: normal; }
  /* The design gutters this screen at 16px, not the sheet's default 20px. */
  #quizSheet[data-style="topic"].is-collapsed .sheet__body {
    padding-left: 16px;
    padding-right: 16px;
  }
  @media (prefers-reduced-motion: reduce) {
    #quizSheet[data-style="topic"] .sheet__header--image,
    #quizSheet[data-style="topic"] .sheet__body { transition: none; }
  }

  /* ----- Timer variant (?flow=timer) -----
     The design's end card (node 3359:15417) stays — but its "Back to Ela"
     button IS the countdown: a darker fill drains right→left over 5s. No
     action → the chat opens itself; a tap → back to Ela (exit). The card
     fills the sheet body so the button pins to the bottom, per the design. */
  #quizSheet.is-card .sheet__body { display: flex; flex-direction: column; }
  #quizSheet.is-card #quizChat { flex: 1 1 auto; }
  .quiz-card {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    text-align: center;
    padding: 64px 32px 32px;
    animation: quiz-card-in 320ms cubic-bezier(0.23, 1, 0.32, 1) both;
  }
  @keyframes quiz-card-in {
    from { opacity: 0; transform: scale(0.97) translateY(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .quiz-card.is-leaving {
    animation: quiz-outro-out 240ms cubic-bezier(0.23, 1, 0.32, 1) both;
  }
  .quiz-card__top {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 51px;
  }
  .quiz-card__icon {
    width: 113px;
    height: 113px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--br-full);
    background: var(--bg-brand-primary);
    color: var(--bg-active);
    font-size: 48px;
    flex-shrink: 0;
  }
  .quiz-card__copy {
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 289px;
  }
  .quiz-card h3 {
    margin: 0;
    font-family: var(--ff-display);
    font-weight: var(--fw-bold);
    font-size: var(--fz-m);
    line-height: 1.2;
    color: var(--text-primary);
  }
  .quiz-card p {
    margin: 0;
    font-size: var(--fz-m);
    line-height: 1.4;
    color: var(--text-secondary);
  }
  .quiz-card p b { font-weight: var(--fw-bold); }

  /* The button-as-loader: the remaining time is the deeper-green layer, and
     it drains toward the left; label and icon ride above it. The design's
     button hugs its label, so opt out of .btn--l's full width. */
  .quiz-card__cta {
    position: relative;
    overflow: hidden;
    width: auto;
    --btn-px: 16px;
  }
  .quiz-card__cta .cta-timer {
    position: absolute;
    inset: 0;
    background: var(--fg-brand);
    pointer-events: none;
    /* Drains right→left: scaleX from the LEFT edge, transform-only (GPU). */
    transform-origin: left center;
  }
  .quiz-card__cta > :not(.cta-timer) { position: relative; }

  /* ----- Recap variant (?flow=recap) -----
     The Q&A folds up into a compact receipt pinned at the top of the chat —
     closure and the submission status in one glance — and Ela carries on
     beneath it. */
  #quizChat .chat-msg.is-folding {
    overflow: hidden;
    transition: height 340ms var(--ease-in-out),
                opacity 260ms var(--ease-out),
                margin 340ms var(--ease-in-out);
    opacity: 0;
    height: 0 !important;
    margin-top: 0 !important;
    margin-bottom: 0 !important;
  }
  /* ===== Sleek minimalist completion — three treatments =====
     Same beat (the log finishes and becomes a conversation) with the chrome
     dialled right down. Selected with `?style=`:

       tile     (default) — visual: a hairline strip carrying the log's
                            illustration; starters are image tiles with the
                            label outside the image.
       hairline           — typographic: rules instead of cards; starters are
                            icon + text chips.
       voice              — conversational: no receipt at all. The header badge
                            carries completion, Ela's message carries status and
                            reward, and her typing indicator IS the timer.

     All three hold the Jul 31 feedback: badge replaces the progress bar, the
     reward is named, starters are contextual, and the wait is expressed rather
     than hidden. */
  .receipt {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    animation: extend-msg-in 380ms cubic-bezier(0.23, 1, 0.32, 1) both;
  }
  .receipt__text {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }
  .receipt__title {
    margin: 0;
    font-family: var(--ff-display);
    font-weight: var(--fw-bold);
    font-size: var(--fz-sm);
    color: var(--text-primary);
  }
  .receipt__meta {
    margin: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: var(--fz-s);
    color: var(--text-secondary);
  }
  .receipt__reward {
    color: var(--fg-brand);
    font-weight: var(--fw-bold);
  }
  .receipt__tick { color: var(--fg-brand); font-size: 10px; }
  .receipt__check {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    flex: 0 0 auto;
    border-radius: var(--br-full);
    background: var(--bg-brand-primary);
    color: var(--bg-active);
    font-size: 12px;
  }
  /* Crit 3c — the wait is shown rather than hidden: a hairline drains under
     the receipt while the chat readies itself. */
  .receipt__beat {
    position: absolute;
    left: 0;
    right: 0;
    bottom: -1px;
    height: 1px;
    background: var(--bg-brand-primary);
    transform-origin: left center;
  }

  /* ----- tile: the visual answer, minus the chrome ----- */
  [data-style="tile"] .receipt {
    padding: 10px;
    background: var(--bg-active);
    border: 1px solid var(--stroke-secondary);
    border-radius: var(--br-m);
  }
  [data-style="tile"] .receipt__thumb {
    width: 44px;
    height: 44px;
    flex: 0 0 auto;
    border-radius: var(--br-sm);
    object-fit: cover;
  }
  [data-style="tile"] .receipt__beat {
    left: 10px;
    right: 10px;
    bottom: 6px;
    height: 2px;
    border-radius: var(--br-full);
  }

  /* ----- hairline: rules instead of cards ----- */
  [data-style="hairline"] .receipt {
    padding: 12px 0;
    border-top: 1px solid var(--stroke-secondary);
    border-bottom: 1px solid var(--stroke-secondary);
  }

  /* ----- Badge weight scales with how much it carries: quietest in hairline
     (the receipt repeats it), strongest in voice (it is the only signal). ----- */
  [data-style="hairline"] .header-badge {
    padding: 4px 2px;
    background: transparent;
    border: 0;
    box-shadow: none;
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
    color: var(--fg-contrast);
    /* No pill, so the type carries itself over light parts of the image —
       same trick the sheet title relies on, just more explicit at this size. */
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45);
  }
  [data-style="hairline"] .header-badge__check {
    width: 16px;
    height: 16px;
    background: transparent;
    color: var(--fg-contrast);
    font-size: 12px;
  }
  [data-style="tile"] .header-badge { box-shadow: none; }

  @media (prefers-reduced-motion: reduce) {
    .chat-msg--outro.is-leaving,
    .quiz-card,
    .quiz-card.is-leaving,
    .header-badge,
    .receipt,
    #quizSheet.is-opening .sheet__footer,
    #quizSheet.is-opening .extend-starters > * { animation: none; }
    /* The button's draining fill stays — it IS the countdown. */
    #quizChat .chat-msg.is-folding { transition: none; }
  }

  /* The lift walks offsetTop up to the scroller, so the scroller has to BE an
     offsetParent. Static positioning let the walk escape past it into the phone
     frame and add its offsets to the target — the question scrolled clean off
     the top on the desktop page (the mobile branch has no frame offsets, which
     is why it only showed there). */
  #quizSheet .sheet__body { position: relative; }

  /* The answers live IN the conversation, under Ela's question — the pattern the
     app ships today. (The sheet still carries an .answer-dock element for the
     completion flows; it is no longer used for questions.) */
  .quiz-dock { flex: 0 0 auto; }
  .quiz-dock[hidden] { display: none; }

  /* Indented to Ela's text column: her badge is 25px with an 8px gap, so the
     options start where her words do and the exchange reads as one column. */
  #quizChat .quiz-options {
    padding-left: 33px;
    animation: extend-msg-in 380ms var(--ease-out) both;
  }
  #quizChat .quiz-options .multiple-choice { gap: 8px; }
  /* Options arrive just after the question, one after another. */
  #quizChat .quiz-options .mc__option {
    animation: extend-msg-in 320ms var(--ease-out) both;
  }
  #quizChat .quiz-options .mc__option:nth-child(2) { animation-delay:  40ms; }
  #quizChat .quiz-options .mc__option:nth-child(3) { animation-delay:  80ms; }
  #quizChat .quiz-options .mc__option:nth-child(4) { animation-delay: 120ms; }
  #quizChat .quiz-options .mc__option:nth-child(5) { animation-delay: 160ms; }
  /* Confirm sits with the options, not in a dock. */
  #quizChat .quiz-options__cta { margin-top: 12px; width: 100%; }
  @media (prefers-reduced-motion: reduce) {
    #quizChat .quiz-options,
    #quizChat .quiz-options .mc__option { animation: none; }
  }

  /* ===== Extended free-chat mode (states 2–4) =====
     Same sheet, same subject header — only the bottom of the sheet changes:
     the answer dock and progress bar retire, and the starters row + composer
     take over. Keeping the sheet identity is what makes this read as a
     continuation rather than a hand-off to a different surface. */
  #quizSheet.is-extended .progress { display: none; }
  #quizSheet.is-extended .quiz-dock { display: none; }

  /* Suggested follow-up prompts — horizontal scroll just above the composer,
     mirroring `.topic-starters-row` in chat.html. Hidden once the user has sent
     anything, since by then they've shown they know what to ask. */
  /* Same row treatment as the topic sheet's `.topic-starters-row` in
     chat.html — the pattern this extends. */
  .extend-starters {
    flex: 0 0 auto;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 20px 8px;
    scrollbar-width: none;
    overscroll-behavior-x: contain;
  }
  .extend-starters::-webkit-scrollbar { display: none; }
  .extend-starters > * { flex: 0 0 auto; }
  .extend-starters[hidden] { display: none; }
  #quizSheet.is-conversing .extend-starters { display: none; }

  /* Composer pinned to the bottom of the sheet, below the scrolling chat. */
  .sheet__footer {
    flex-shrink: 0;
    padding: 8px 16px 20px;
  }
  .sheet__footer[hidden] { display: none; }
</style>
<style>

    <script>
